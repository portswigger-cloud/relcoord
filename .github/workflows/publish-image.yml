name: Publish Docker image

on:
  push:
    branches:
      - main
  # A pull request builds the image too, so that a Dockerfile that no longer
  # builds fails there rather than after it merges. Only main publishes: nothing
  # else signs in to AWS, and the publish role's trust policy would refuse any
  # other ref anyway.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # The vanity alias of the same registry as public.ecr.aws/q3z6g1h3.
  IMAGE_REGISTRY: public.ecr.aws/portswigger-platform
  # The repository within it, which is also what the ECR Public API takes: a
  # describe-images call names the repository of the caller's own registry, so it
  # does not carry the alias.
  IMAGE_REPOSITORY: relcoord

jobs:
  # Works out what the image is called, and on main whether it is already
  # published, once for both architectures.
  prepare:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.image-version.outputs.tag }}
      image_version: ${{ steps.image-version.outputs.image_version }}
      version: ${{ steps.image-version.outputs.version }}
      exists: ${{ steps.published.outputs.exists }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The image tag names the nearest reachable vX.Y.Z tag, and finding it
          # takes the tags and the history between them and HEAD, neither of which
          # a shallow checkout has.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Compute Docker image tag
        id: image-version
        run: |
          # <nearest reachable vX.Y.Z>-<hash of the build context>, which is what
          # bktools pipelinegen tags a container with too.
          image_version="$(uv run --locked --group dev bktools-image-version-hash --tag)"
          echo "tag=${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}:${image_version}" >> "$GITHUB_OUTPUT"
          echo "image_version=${image_version}" >> "$GITHUB_OUTPUT"
          # The version is the tag without the trailing build hash. Taking it from
          # the same string keeps the version in the image and the version in its
          # tag from disagreeing.
          echo "version=${image_version%-*}" >> "$GITHUB_OUTPUT"
          # Written to the job summary so that the version a run produced is on the
          # run's own page, rather than inside the log of whichever step computed it.
          {
            echo "## relcoord ${image_version}"
            echo
            echo "- **Image:** \`${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}:${image_version}\`"
            echo "- **Version:** \`${image_version%-*}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note that this run does not publish
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Not on main, so this run builds the image for each architecture without publishing it." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::436027055282:role/crossplane/relcoord-ecr-publish
          aws-region: us-east-1

      - name: Check whether the image is already published
        id: published
        if: github.ref == 'refs/heads/main'
        run: |
          # The tag is a hash of the build context, so a tag already in the registry
          # names an image built from exactly this source and there is nothing to
          # gain from building it again.
          #
          # A check that fails for any other reason than a missing image reports the
          # image as unpublished, so a registry that cannot be reached, or a role
          # without ecr-public:DescribeImages, costs a rebuild rather than skipping a
          # push that never happened. Why it failed is logged either way, so that
          # does not look like an image that was simply absent.
          if error="$(aws ecr-public describe-images \
              --region us-east-1 \
              --repository-name "${IMAGE_REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_VERSION}" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE_VERSION} is already published; skipping the build"
            echo "Already published, so the build was skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$error" == *ImageNotFoundException* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE_VERSION} is not published yet; building"
            echo "Not published yet, so this run builds and pushes it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "could not check whether ${IMAGE_VERSION} is published: ${error}"
            {
              echo "Could not check whether it was already published, so this run"
              echo "builds and pushes it regardless:"
              echo
              echo '```'
              echo "${error}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          IMAGE_VERSION: ${{ steps.image-version.outputs.image_version }}

  # Each architecture builds on a runner of its own kind rather than under QEMU
  # emulation, which made the arm64 half of a single-runner build several times
  # slower than the amd64 half.
  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'

    strategy:
      # So that a pull request shows whether each architecture builds, rather than
      # cancelling one as soon as the other fails.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            digest_output: digest_amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_output: digest_arm64

    runs-on: ${{ matrix.runner }}

    # Each leg sets only its own output, so the two don't overwrite each other.
    outputs:
      digest_amd64: ${{ steps.digest.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.digest.outputs.digest_arm64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::436027055282:role/crossplane/relcoord-ecr-publish
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed by digest alone, without the tag: the merge job tags it once
          # both architectures are in the registry, so the tag never names an image
          # that has only one of them. Off main, nothing is pushed.
          outputs: type=image,name=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' }}
          build-args: |
            RELCOORD_VERSION=${{ needs.prepare.outputs.version }}
            RELCOORD_IMAGE_TAG=${{ needs.prepare.outputs.image_version }}

      - name: Export digest
        id: digest
        run: echo "${DIGEST_OUTPUT}=${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          DIGEST_OUTPUT: ${{ matrix.digest_output }}
          DIGEST: ${{ steps.build.outputs.digest }}

  # Puts the tag on a manifest list naming both architectures' images, which is
  # the moment the image is published.
  merge:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::436027055282:role/crossplane/relcoord-ecr-publish
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the image for both architectures
        run: |
          # An empty digest would otherwise surface as an unhelpful "invalid
          # reference" from imagetools.
          : "${DIGEST_AMD64:?no linux/amd64 digest from the build job}"
          : "${DIGEST_ARM64:?no linux/arm64 digest from the build job}"
          image="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}"
          docker buildx imagetools create \
            --tag "${TAG}" \
            "${image}@${DIGEST_AMD64}" \
            "${image}@${DIGEST_ARM64}"
          docker buildx imagetools inspect "${TAG}"
          echo "Published for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.build.outputs.digest_arm64 }}
