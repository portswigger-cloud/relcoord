# What relcoord deploys for itself, generated by relcoord.
#
# 'namespace' and 'image' are deliberately absent: a non-system change request
# supplies both, the namespace from the repository name and the image from the
# request, and the simple block rejects an 'image' field when it gets one.
#
# The simple block itself lives in portswigger-cloud/system rather than here,
# which is what the plugins-repository setting in relcoord.toml points at.

[[simple]]
replicas = 2
extra-resources = "extra"
iam-role = "arn:aws:iam::{{account_id}}:role/product-roles/relcoord-irsarole"
custom-token-audiences = ["idcat.platform-prod.portswigger.io"]

[simple.config]
"/config/relcoord.toml" = "relcoord.toml"
"/config/platform-dev-ca.pem" = "platform-dev-ca.pem"
